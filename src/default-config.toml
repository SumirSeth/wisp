# Wisp config. Changes apply the next time the launcher opens.

# Shortcut to show or hide the launcher.
# Examples: "Alt+Space", "Ctrl+Shift+Space", "Win+Alt+R", "Ctrl+F12"
hotkey = "Alt+Space"

# Tap the Windows key alone to open Wisp instead of Start. Replaces hotkey
# while on.
win_key = false

# Results visible at once.
max_results = 8

# "system", "dark" or "light"
theme = "system"

# Launcher backdrop: "acrylic", "mica" or "solid"
backdrop = "acrylic"

# Where the launcher opens: "bottom" or "center"
position = "bottom"

# Show recently launched apps when the search box is empty.
show_recent = true

# Web search URL. Wisp replaces {query} with the encoded search text.
search_url = "https://www.google.com/search?q={query}"

# Search file names.
file_search = true

# Search with Everything (voidtools) when it's running: every drive, and words
# anywhere in names. Otherwise, and with false, use the Windows Search index.
file_search_everything = true

# Folder names that file search skips. It always skips files and folders
# whose names start with a dot, such as .git.
file_search_exclude = ["node_modules", "AppData", "site-packages", "__pycache__", "venv", "target", "dist", "build", "Cache", "Code Cache", "GPUCache", "Service Worker", "IndexedDB", "Extensions"]

# Check daily for new stable releases, except on metered connections.
check_for_updates = true

# Hide the Windows taskbar while Wisp runs. The taskbar comes back when Wisp
# quits.
hide_taskbar = true

# Show the dock: running apps, notification icons, status and the clock.
dock = true

# Hide the dock until the pointer touches the bottom edge of a screen. With
# false, the dock stays on the main screen and windows stop above it while the
# taskbar is hidden.
dock_autohide = true
# With autohide on, stay visible until a window overlaps the dock.
dock_dodge_windows = false

# The gap below the dock, in DIPs (0 to 24). 0 puts the dock on the bottom
# edge of the screen. With the dock kept visible, the space kept for it
# shrinks with the gap.
dock_margin = 9

# The screen the dock shows on: "pointer", "main", or a screen chosen in
# Settings. A chosen screen that isn't connected falls back to the main one.
dock_screen = "pointer"

# Show the search button at the start of the dock.
dock_search_button = true

# App window list shown when hovering a running app icon:
# "multiple" (only when the app has multiple windows), "always", or "off".
window_list = "multiple"

# App icons in the dock, in DIPs (24 to 40).
dock_icon_size = 32

# Sections from left to right. Drag a section in the dock to change this order.
dock_order = ["launcher", "apps", "tray", "status", "sound", "battery", "wifi", "bluetooth", "clock"]

# Status items in the group or in their own draggable slots; omitted items are hidden.
dock_status_group = ["sound", "battery", "wifi", "bluetooth"]
dock_status_icons = []

# The color of the dock and the launcher, as "#RRGGBB", or "#RRGGBBAA" where
# AA (00 to FF) sets how strongly the color covers the theme's acrylic. Mica
# and solid show it at full strength. Empty uses the theme's colors.
dock_color = ""
