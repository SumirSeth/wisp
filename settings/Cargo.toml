[package]
name = "wisp-settings"
version = "0.5.0"
edition = "2024"
description = "Settings and onboarding for Wisp"
license = "MIT"
publish = false

[features]
# Side-by-side build with its own data folder and window names.
nightly = []

[dependencies]
gpui-kit = { version = "0.8", default-features = false, features = ["component"] }
toml_edit = "0.23"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinHttp",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
