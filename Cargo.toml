[package]
name = "wisp"
version = "0.6.1"
edition = "2024"
description = "A dock and a launcher for Windows"
license = "MIT"
authors = ["Sumir Seth"]
repository = "https://github.com/SumirSeth/wisp"
readme = "README.md"
keywords = ["dock", "launcher", "taskbar", "windows", "productivity"]
categories = ["command-line-utilities"]

[workspace]
members = ["settings"]

[features]
# Side-by-side build with its own data folder and window names.
nightly = []
# Buffered QPC measurements and isolated capture scenarios; absent in shipping builds.
perf-trace = ["windows/Win32_System_Performance"]

[dependencies]
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1"
windows-core = "0.62"
windows-numerics = "0.3"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "0.62"
features = [
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_NetworkListManager",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Search",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep the launcher on the release profile above.
[profile.release.package]
wisp-settings = { opt-level = "z" }

# These crates are exclusive to Settings. Shared dependencies retain opt-level 3.
# Recheck this list when adding launcher dependencies.
accesskit_consumer = { opt-level = "z" }
accesskit_windows = { opt-level = "z" }
aho-corasick = { opt-level = "z" }
exr = { opt-level = "z" }
fontdb = { opt-level = "z" }
gif = { opt-level = "z" }
gpui-base = { opt-level = "z" }
gpui-component = { opt-level = "z" }
gpui-pre = { opt-level = "z" }
gpui-pre-sum-tree = { opt-level = "z" }
gpui-pre-windows = { opt-level = "z" }
html5ever = { opt-level = "z" }
image = { opt-level = "z" }
image-webp = { opt-level = "z" }
lyon_tessellation = { opt-level = "z" }
markdown = { opt-level = "z" }
markup5ever = { opt-level = "z" }
miniz_oxide = { opt-level = "z" }
png = { opt-level = "z" }
regex = { opt-level = "z" }
regex-automata = { opt-level = "z" }
regex-syntax = { opt-level = "z" }
resvg = { opt-level = "z" }
roxmltree = { opt-level = "z" }
rustybuzz = { opt-level = "z" }
serde_json = { opt-level = "z" }
smallvec = { opt-level = "z" }
svgtypes = { opt-level = "z" }
taffy = { opt-level = "z" }
tiff = { opt-level = "z" }
tiny-skia = { opt-level = "z" }
tiny-skia-path = { opt-level = "z" }
toml_edit = { opt-level = "z" }
ttf-parser = { opt-level = "z" }
usvg = { opt-level = "z" }
zune-jpeg = { opt-level = "z" }
