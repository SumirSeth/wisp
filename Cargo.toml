[package]
name = "wisp"
version = "0.2.2"
edition = "2024"
description = "An app launcher for Windows"
license = "MIT"
authors = ["Sumir Seth"]
repository = "https://github.com/SumirSeth/wisp"
readme = "README.md"
keywords = ["launcher", "windows", "productivity", "powertoys"]
categories = ["command-line-utilities"]

[workspace]
members = ["settings"]

[dependencies]
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1"
windows-numerics = "0.3"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Search",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
