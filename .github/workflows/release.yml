name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # SignPath downloads the unsigned executables with this workflow's token.
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the Rust version.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      # Releases are signed once the repository variable SIGNPATH_SIGNING_POLICY_SLUG
      # is set to the release policy, which uses the production certificate. It also
      # needs the variables SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG, and the
      # secret SIGNPATH_API_TOKEN. Each release waits for its approval in SignPath.
      - name: Version
        id: version
        shell: pwsh
        run: "\"number=$('${{ github.ref_name }}'.TrimStart('v'))\" >> $env:GITHUB_OUTPUT"
      - name: Upload unsigned executables
        id: unsigned
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ github.ref_name }}
          path: |
            target/release/wisp.exe
            target/release/wisp-settings.exe
          if-no-files-found: error
      - name: Sign
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.number }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/release
      - name: Package
        shell: pwsh
        run: |
          $name = "wisp-${{ github.ref_name }}-x86_64-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/wisp.exe, target/release/wisp-settings.exe, README.md, LICENSE $name
          Compress-Archive "$name/*" "$name.zip"
          # Standalone exes are only for 0.5.x updaters. Drop them once those are rare,
          # no earlier than two releases after the zip updater ships.
          Copy-Item target/release/wisp.exe "wisp-${{ github.ref_name }}-x86_64.exe"
          Copy-Item target/release/wisp-settings.exe "wisp-settings-${{ github.ref_name }}-x86_64.exe"
          $files = "$name.zip", "wisp-${{ github.ref_name }}-x86_64.exe", "wisp-settings-${{ github.ref_name }}-x86_64.exe"
          $files | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash + "  $_" } | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Generate package manifests
        shell: pwsh
        run: |
          ./packaging/winget/generate.ps1 -Tag "${{ github.ref_name }}" `
            -ZipPath "wisp-${{ github.ref_name }}-x86_64-windows.zip" -OutputDirectory manifests
      - name: Upload package manifests
        uses: actions/upload-artifact@v4
        with:
          name: package-manifests-${{ github.ref_name }}
          path: manifests/
          if-no-files-found: error
      # The notes start with the download, then the version's CHANGELOG.md section and the
      # pull requests GitHub lists for the release (.github/release.yml).
      - name: Notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw),
            "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          if (-not $section) { throw "CHANGELOG.md has no section for $version" }
          $pulls = gh api "repos/${{ github.repository }}/releases/generate-notes" `
            -f tag_name="${{ github.ref_name }}" --jq .body
          $pulls = $pulls -join "`n"
          $download = '**Download `wisp-${{ github.ref_name }}-x86_64-windows.zip`**, extract it and run `wisp.exe`. The separate .exe files are for the built-in updater.'
          "$download`n`n$section`n`n<details>`n<summary>Pull requests</summary>`n`n$pulls`n`n</details>`n" |
            Out-File -Encoding utf8 notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "wisp-${{ github.ref_name }}-x86_64-windows.zip" `
            "wisp-${{ github.ref_name }}-x86_64.exe" `
            "wisp-settings-${{ github.ref_name }}-x86_64.exe" `
            SHA256SUMS.txt `
            --title "Wisp ${{ github.ref_name }}" --notes-file notes.md
